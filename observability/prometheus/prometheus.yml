global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: ingestion
    static_configs:
      - targets:
          - ingestion:8000
  - job_name: worker
    static_configs:
      - targets:
          - worker:9101
  - job_name: erp_mock
    static_configs:
      - targets:
          - erp_mock:8001
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
