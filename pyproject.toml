[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-ai"
version = "0.1.0"
description = "Self-hosted document-to-action platform for invoice processing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "fpdf2>=2.8.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "mlflow>=2.19.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-celery>=0.50b0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.10.0",
    "pypdf>=5.0.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.18",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.41.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
    "types-requests>=2.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "llmops*", "scripts*"]

[tool.setuptools.package-data]
"services.worker.extraction" = ["prompts/*.txt"]
"llmops" = ["datasets/**/*.json", "baselines/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require PostgreSQL",
    "e2e: end-to-end workflow tests that require PostgreSQL",
    "live_qwen: optional live llama.cpp Qwen checks excluded from default runs",
    "observability_compose: optional checks that require observability Compose services",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "llmops", "scripts", "tests"]
mypy_path = "."
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "mlflow",
    "mlflow.*",
    "opentelemetry.*",
    "prometheus_client",
    "prometheus_client.*",
]
ignore_missing_imports = true
